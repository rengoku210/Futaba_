[project]
name = "futaba"
version = "0.1.0"
description = "Futaba — Autonomous Windows AI Copilot built on Hermes Agent"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "httpx>=0.24",
    "websockets>=12.0",
    "rich>=13.0",
    "click>=8.0",
    "pillow>=9.0",
    "sounddevice>=0.4",
    "SpeechRecognition>=3.10",
    "psutil>=5.9",
    "aiohttp>=3.8",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.8", "torch>=2.0", "transformers>=4.30"]
voice = ["openai-whisper>=20230918"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
futaba = "futaba.core.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
